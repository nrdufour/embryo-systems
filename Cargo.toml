[workspace]
members = [
    "crates/hbds-core",
    "crates/hbds-lists",
    "crates/hbds-gtad",
    "crates/hbds-functors",
    "crates/hbds-journal",
    "crates/adt81",
]
resolver = "3"

[workspace.package]
rust-version = "1.88"
license = "MIT"

[package]
name = "embryo-systems"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
adt81 = { path = "crates/adt81" }
hbds-gtad = { path = "crates/hbds-gtad" }
hbds-journal = { path = "crates/hbds-journal" }
