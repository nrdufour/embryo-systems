[workspace]
members = [
    "crates/hbds-core",
    "crates/hbds-maps",
    "crates/hbds-values",
    "crates/hbds-acode",
    "crates/hbds-vm",
    "crates/hbds-http",
    "crates/hbds-daemon",
    "crates/hbds-lists",
    "crates/hbds-gtad",
    "crates/hbds-functors",
    "crates/hbds-journal",
    "crates/hbds-rules",
    "crates/hbds-simulation",
    "crates/hbds-reflexes",
    "crates/adt81",
    "crates/bench",
]
resolver = "3"

[workspace.package]
rust-version = "1.89"
license = "MIT"

[package]
name = "embryo-systems"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[dependencies]
hbds-daemon = { path = "crates/hbds-daemon" }
adt81 = { path = "crates/adt81" }
hbds-gtad = { path = "crates/hbds-gtad" }
hbds-journal = { path = "crates/hbds-journal" }
hbds-acode = { path = "crates/hbds-acode" }
hbds-vm = { path = "crates/hbds-vm" }

[dev-dependencies]
hbds-http = { path = "crates/hbds-http" }
