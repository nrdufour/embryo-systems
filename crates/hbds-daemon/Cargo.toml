[package]
name = "hbds-daemon"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

# The daemon (docs/architecture.md, decisions 3 and 8): one executor
# owning the store, clients' sessions taking turns on it, over a Unix
# socket. No language of its own: the command lends one.
[dependencies]
hbds-acode = { path = "../hbds-acode" }
hbds-gtad = { path = "../hbds-gtad" }
hbds-http = { path = "../hbds-http" }
hbds-journal = { path = "../hbds-journal" }
hbds-vm = { path = "../hbds-vm" }
